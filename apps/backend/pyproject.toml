[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Portfolio API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
]

[tool.setuptools.packages.find]
include = ["app*"]
